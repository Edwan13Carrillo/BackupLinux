---
- name: Configuracion post-instalacion de Cachyos
  hosts: localhost

  vars:
    config_bk_dir: "{{ ansible_env.HOME }}/BackupLinux/linux/configs"
    local_dir: "{{ ansible_env.HOME }}/.local/share"
    config_dir: "{{ ansible_env.HOME }}/.config"
    profile: "{{ PROFILE | default('plasma') }}"

    dotfiles_comunes:
      - { origen: "{{ config_bk_dir }}/fonts/", destino: "{{ local_dir }}/fonts/", delete: false, sudo: false }
      - { origen: "{{ config_bk_dir }}/pixels", destino: "/usr/share/plymouth/themes/", delete: true, sudo: true }
      - { origen: "{{ config_bk_dir }}/local/Bibata-Modern-Ice", destino: "{{ ansible_env.HOME }}/.icons/", delete: true, sudo: false }
      - { origen: "{{ config_bk_dir }}/fastfetch/", destino: "{{ config_dir }}/fastfetch/", delete: false, sudo: false }
      - { origen: "{{ config_bk_dir }}/alacritty/", destino: "{{ config_dir }}/alacritty/", delete: false, sudo: false }
      - { origen: "{{ config_bk_dir }}/haruna/", destino: "{{ config_dir }}/haruna/", delete: false, sudo: false }

    dotfiles_plasma:
      # Configuracion de temas y apariencia local de Plasma
      - { origen: "{{ config_bk_dir }}/local/Layan", destino: "{{ local_dir }}/aurorae/themes/", delete: true, sudo: false }
      - { origen: "{{ config_bk_dir }}/local/desktoptheme", destino: "{{ local_dir }}/plasma/", delete: true, sudo: false }
      - { origen: "{{ config_bk_dir }}/local/a2n.kuro", destino: "{{ local_dir }}/plasma/look-and-feel/", delete: false, sudo: false }
      - { origen: "{{ config_bk_dir }}/Tela", destino: "{{ local_dir }}/icons/", delete: true, sudo: false }
      - { origen: "{{ config_bk_dir }}/local/org.kde.plasma.clearclock", destino: "{{ local_dir }}/plasma/plasmoids/", delete: true, sudo: false }
      - { origen: "{{ config_bk_dir }}/local/cachyosTG", destino: "{{ local_dir }}/plasma/look-and-feel/", delete: false, sudo: false }
      - { origen: "{{ config_bk_dir }}/kdedefaults/", destino: "{{ config_dir }}/kdedefaults/", delete: false, sudo: false }

    # Reservado para futuros dotfiles de Niri + Noctalia.
    dotfiles_niri: []

    firewall_rules:
      - { puerto: "1714:1764", proto: "udp" }
      - { puerto: "1714:1764", proto: "tcp" }
      - { puerto: "8080", proto: "tcp", interface: "tailscale0" }
      - { puerto: "7884", proto: "udp", interface: "tailscale0" }
      - { puerto: "7889", proto: "tcp", interface: "tailscale0" }

    snapper_limits:
      - { clave: "TIMELINE_LIMIT_HOURLY", valor: "0" }
      - { clave: "TIMELINE_LIMIT_DAILY", valor: "5" }
      - { clave: "TIMELINE_LIMIT_WEEKLY", valor: "1" }
      - { clave: "TIMELINE_LIMIT_MONTHLY", valor: "0" }
      - { clave: "TIMELINE_LIMIT_YEARLY", valor: "0" }
      - { clave: "NUMBER_LIMIT", valor: "0" }
      - { clave: "NUMBER_LIMIT_IMPORTANT", valor: "15" }

  tasks:

    # ─────────────────────────────────────────
    # Paquetes
    # ─────────────────────────────────────────

    - name: Instalar paquetes necesarios.
      community.general.pacman:
        name:
          - discord
          - telegram-desktop
          - zen-browser-bin
          - libreoffice-still
          - libreoffice-still-es
          - git
          - fastfetch
          - yt-dlp
          - qbittorrent
          - fuse2
          - mkvtoolnix-gui
          - prismlauncher
          - base-devel
          - yay
          - flatpak
          - python-mutagen
          - tk
          - rsync
          - snapper
          - cachyos-snapper-support
          - btrfs-assistant
        state: present
      become: true
      tags:
        - paquetes

    - name: Instalar paquetes de red y firewall.
      community.general.pacman:
        name:
          - tailscale
          - ufw
        state: present
      become: true
      tags:
        - paquetes
        - network_packages

    - name: Instalar Visual Studio Code del AUR.
      community.general.pacman:
        name: visual-studio-code-bin
        executable: yay
        state: present
      tags:
        - paquetes

    - name: Agregar el remote de Flathub.
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
      tags:
        - paquetes

    - name: Instalar Sober de Flatpak.
      community.general.flatpak:
        name: org.vinegarhq.Sober
        state: present
      tags:
        - paquetes

    # ─────────────────────────────────────────
    # Firewall
    # ─────────────────────────────────────────

    - name: Configurar reglas de firewall.
      community.general.ufw:
        rule: allow
        direction: in
        port: "{{ item.puerto }}"
        proto: "{{ item.proto }}"
        interface: "{{ item.interface | default(omit) }}"
      loop: "{{ firewall_rules }}"
      loop_control:
        label: "{{ item.proto }}/{{ item.puerto }}{{ ' via ' + item.interface if item.interface is defined else '' }}"
      become: true
      tags:
        - firewall

    - name: Habilitar UFW.
      community.general.ufw:
        state: enabled
      become: true
      tags:
        - firewall

    # ─────────────────────────────────────────
    # Dotfiles
    # ─────────────────────────────────────────

    - name: Validar perfil de dotfiles.
      ansible.builtin.assert:
        that: profile in ['plasma', 'niri']
        fail_msg: "PROFILE debe ser 'plasma' o 'niri'."
      tags:
        - dotfiles

    - name: Crear carpetas destino si no existen.
      ansible.builtin.file:
        path: "{{ item.destino }}"
        state: directory
        mode: "0755"
      loop: "{{ dotfiles_comunes + (dotfiles_plasma if profile == 'plasma' else dotfiles_niri) }}"
      become: "{{ item.sudo }}"
      tags:
        - dotfiles

    - name: Copiar dotfiles con rsync.
      ansible.posix.synchronize:
        src: "{{ item.origen }}"
        dest: "{{ item.destino }}"
        delete: "{{ item.delete }}"
      loop: "{{ dotfiles_comunes + (dotfiles_plasma if profile == 'plasma' else dotfiles_niri) }}"
      become: "{{ item.sudo }}"
      tags:
        - dotfiles

    - name: Refrescar cache de fuentes.
      ansible.builtin.command:
        cmd: fc-cache -f -v
      become: false
      changed_when: false
      tags:
        - dotfiles

    - name: Aviso - Revisar fuentes instaladas.
      ansible.builtin.debug:
        msg: "Aplica las fuentes en: Ajustes del sistema > Fuentes (Fredoka Medium 12pt / 10pt)."
      when: profile == 'plasma'
      tags:
        - dotfiles

    - name: Aviso - Tema global CachyTG.
      ansible.builtin.debug:
        msg: "Ve a: Ajustes del sistema > Aspecto > Tema global y selecciona 'CachyTG' para aplicarlo."
      when: profile == 'plasma'
      tags:
        - dotfiles

    - name: Aviso - Reiniciar sesión para aplicar temas.
      ansible.builtin.debug:
        msg: "Cierra sesión y vuelve a entrar para que KDE aplique todos los temas."
      when: profile == 'plasma'
      tags:
        - dotfiles

    - name: Aviso - Widget Clear Clock.
      ansible.builtin.debug:
        msg: "Agrega el widget Clear Clock al escritorio, reemplaza su config.qml y luego refresca Plasma con: kquitapp6 plasmashell && kstart5 plasmashell"
      when: profile == 'plasma'
      tags:
        - dotfiles

    # ─────────────────────────────────────────
    # Game Zone
    # ─────────────────────────────────────────

    - name: Crear subvolumen /games.
      ansible.builtin.command:
        cmd: btrfs subvolume create /games
        creates: /games
      become: true
      tags:
        - gamezone

    - name: Verificar si NoCow esta activo en /games.
      ansible.builtin.command:
        cmd: lsattr /games
      register: lsattr_result
      changed_when: false
      tags:
        - gamezone

    - name: Deshabilitar Copy-on-Write en /games.
      ansible.builtin.command:
        cmd: chattr +C /games
      become: true
      when: "'C' not in lsattr_result.stdout.split()[0]"
      changed_when: true
      tags:
        - gamezone

    - name: Asignar propiedad de /games al usuario.
      ansible.builtin.file:
        path: /games
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
      become: true
      tags:
        - gamezone

    # ─────────────────────────────────────────
    # Snapper
    # ─────────────────────────────────────────

    - name: Crear configuracion root de snapper.
      ansible.builtin.command:
        cmd: snapper -c root create-config /
        creates: /etc/snapper/configs/root
      become: true
      tags:
        - snapper

    - name: Configurar limites de snapshots de snapper.
      ansible.builtin.lineinfile:
        path: "/etc/snapper/configs/root"
        regexp: "^{{ item.clave }}="
        line: '{{ item.clave }}="{{ item.valor }}"'
      loop: "{{ snapper_limits }}"
      become: true
      tags:
        - snapper

    - name: Aviso - Crear snapshot maestra.
      ansible.builtin.debug:
        msg: "Cuando el sistema esté listo, ejecuta: sudo snapper -c root create --description 'Sistema base configurado' para crear un snapshot inicial."
      tags:
        - snapper
